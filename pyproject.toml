[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-examples"
version = "0.2.0"
description = "Nodestro Examples – the 24 example multi-agent workflows of Nodestro in six languages, with sample files and test cases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    # The public workflow schemas and the writers of the sample files.
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@3178e223c123e2f37f7cea72cc4815da8c75cb06",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-examples"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_examples"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nodestro_examples"]
mypy_path = "src"
