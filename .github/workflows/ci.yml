name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-FAST AP1: p99 5.7 min, slowest entry 3.13 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Nodestro components and orkexa are version ranges in pyproject.toml; the studio lock pins their exact
      # commits (without this package's own line). pip 26.1 or later applies it to the git requirements.
      - name: Install
        run: |
          set -o pipefail
          python -m pip install "pip>=26.1"
          curl -fsSL https://raw.githubusercontent.com/peterkarlhuber/nodestro-studio/master/platform/internal-server.txt -o "$RUNNER_TEMP/lock-all.txt" # no pipe: a failed download must fail the step
          grep -v '^nodestro-examples ' "$RUNNER_TEMP/lock-all.txt" > "$RUNNER_TEMP/lock.txt"
          pip install -c "$RUNNER_TEMP/lock.txt" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Templates, the six languages, sample files, test cases, decisions, approvals and the docs generator.
      - run: pytest
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  package:
    # The wheel installs on its own and contains everything the package needs at run time.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.3 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Install the wheel into a fresh environment
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/peterkarlhuber/nodestro-studio/master/platform/internal-server.txt -o "$RUNNER_TEMP/lock-all.txt" # no pipe: a failed download must fail the step
          grep -v '^nodestro-examples ' "$RUNNER_TEMP/lock-all.txt" > "$RUNNER_TEMP/lock.txt"
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install "pip>=26.1"
          "$RUNNER_TEMP/wheel/bin/pip" install -c "$RUNNER_TEMP/lock.txt" dist/*.whl
      - name: Check the contents of the installed wheel
        run: |
          cp scripts/check_package.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" check_package.py
      - name: The sdist contains the sources, tests and package data
        run: |
          tar -tzf dist/*.tar.gz > contents.txt
          grep -q "src/nodestro_examples/templates/parts/quality-check.json" contents.txt
          grep -q "src/nodestro_examples/texts/pt-BR/_common.json" contents.txt
          grep -q "src/nodestro_examples/samples/real-estate/floor-plan.png" contents.txt
          grep -q "tests/test_cases.py" contents.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
